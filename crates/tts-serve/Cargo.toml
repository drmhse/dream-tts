[package]
name = "tts-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dream-tts-serve"
path = "src/main.rs"

[dependencies]
tts-core = { path = "../tts-core", default-features = false }
tts-engines = { path = "../tts-engines", default-features = false }
tts-jobs = { path = "../tts-jobs" }
anyhow = { workspace = true }
clap = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The progress stream is server-sent events; `futures` supplies the stream adaptor.
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["metal"]
metal = ["tts-engines/metal", "tts-core/metal"]
