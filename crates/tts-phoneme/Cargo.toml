[package]
name = "tts-phoneme"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
safetensors.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The spaCy patterns use lookahead (`^\+(?![0-9])`), which the `regex` crate has none of.
fancy-regex = "0.13"
unicode-normalization = "0.1"

[dev-dependencies]
clap.workspace = true

[[bin]]
name = "phoneme-validate"
path = "src/bin/validate.rs"

[[bin]]
name = "phonemize"
path = "src/bin/phonemize.rs"
