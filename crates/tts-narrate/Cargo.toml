[package]
name = "tts-narrate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
serde_json = "1"
# Lookbehind and lookahead. The rules ported here depend on them throughout — `(?<=\s)-(?=\s)`
# is arithmetic and any other hyphen is not — and the `regex` crate has neither. fancy-regex
# wraps it and only falls back to backtracking for the patterns that need it.
fancy-regex = "0.19"
once_cell = "1"

[[bin]]
name = "narrate-diff"
path = "src/bin/diff.rs"
